<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to plan and organize your cosplay projects.">
    <title>Login | Cosplay Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="container">
        <section class="form-box">
            <h1>Cosplay Planner</h1>
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div id="loginMessage" class="message" aria-live="polite"></div>
            <p class="switch-form">Don't have an account? <a href="pages/register.html">Register here</a></p>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
